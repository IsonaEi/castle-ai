[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "castle-ai"
version = "1.0.0"
description = "a training‑free foundation‑model pipeline for unsupervised, cross‑species behavioral classification"
readme = "README.md"
license = {text = "Apache License"}
maintainers = [
    {name = "Raiso Liu", email = "raiso@as.edu.tw"}
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research", 
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix", 
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "tqdm", 
    "av==12.1.0",
    "numpy",
    "opencv-python-headless",
    "umap-learn", 
    "plotly==5.22.0",
    "gradio==4.44.0",
    "gdown",
    "h5py",
    "natsort",
    "torch",
    "torchvision",
    "hydra-core",  # SAM2 所需依賴
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov", 
    "pytest-xdist",
    "pytest-env",
]
cuda = [
    "cuml-cu12==25.2.*",
    "xformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["castle*"]

[tool.pytest.ini_options]
# 測試檔案和目錄
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# 測試標記（marks）
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "manual: marks tests as manual tests that require user intervention",
    "cuda_required: marks tests that require CUDA",
    "model_required: marks tests that require model weights",
    "skip_on_ci: marks tests to skip in CI environment"
]

# VSCode 和本地開發的預設配置（執行所有測試）
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose", 
    "--tb=short",
    "--showlocals",
    "--durations=10",
    "--color=yes",
    "--maxfail=3",
    "--disable-warnings",
]

# 覆蓋率配置（可選擇性啟用）
[tool.pytest.coverage]
addopts_with_coverage = [
    "--cov=castle",
    "--cov-report=html",
    "--cov-report=term-missing", 
    "--cov-report=xml"
]

# CI 環境變數配置
[tool.pytest_env]
CI = {value = "false", skip_if_set = true}
SKIP_HEAVY_TESTS = {value = "false", skip_if_set = true}

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "setup.py",
    "*/site-packages/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]