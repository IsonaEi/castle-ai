[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "castle-ai"
version = "1.0.0"
description = "a training‑free foundation‑model pipeline for unsupervised, cross‑species behavioral classification"
readme = "README.md"
license = {text = "Apache License"}
maintainers = [
    {name = "Raiso Liu", email = "raiso@as.edu.tw"}
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research", 
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix", 
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "tqdm", 
    "av==12.1.0",
    "numpy",
    "opencv-python-headless",
    "umap-learn", 
    "plotly==5.22.0",
    "gradio==4.44.0",
    "h5py",
    "natsort",
    "torch",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov", 
    "pytest-xdist",
]
cuda = [
    "cuml-cu12==25.2.*",
]
pytorch = [
    "torch",
    "torchvision", 
    "xformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["castle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "manual: marks tests as manual tests that require user intervention",
    "cuda_required: marks tests that require CUDA (deselect with '-m \"not cuda_required\"')",
    "model_required: marks tests that require model weights (deselect with '-m \"not model_required\"')"
]

addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
    "--color=yes"
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "setup.py",
    "*/site-packages/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
