name: Test ROI Manager

on:
  push:
    paths:
      - 'castle/utils/roi_manager.py'
      - 'tests/test_roi_manager.py'
      - 'requirements.txt'
      - 'pytest.ini'
  pull_request:
    paths:
      - 'castle/utils/roi_manager.py'
      - 'tests/test_roi_manager.py'
      - 'requirements.txt'
      - 'pytest.ini'

jobs:
  test-roi-manager:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: [3.9, "3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ matrix.python-version }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist h5py numpy

    - name: Install package in development mode
      run: |
        pip install -e .

    - name: Run ROI Manager tests with coverage
      run: |
        pytest tests/test_roi_manager.py \
          -v \
          --cov=castle.utils.roi_manager \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=80

    - name: Run performance tests
      run: |
        pytest tests/test_roi_manager.py -m slow -v --tb=short
      continue-on-error: true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9'
      with:
        file: ./coverage.xml
        flags: roi-manager
        name: roi-manager-coverage

  test-memory-usage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-benchmark memory-profiler h5py numpy
        pip install -e .

    - name: Run memory usage tests
      run: |
        python -c "
        import numpy as np
        from castle.utils.roi_manager import ROIManager
        import tempfile
        import os
        
        # 測試大量資料的記憶體使用
        with tempfile.NamedTemporaryFile(suffix='.h5', delete=False) as tmp:
            roi_manager = ROIManager(tmp.name, 
                                   video_basename='test.mp4', 
                                   video_length=1000,
                                   video_height=480,
                                   video_width=640,
                                   video_fps=30.0)
            
            # 寫入大量遮罩資料
            for i in range(100):
                mask = np.random.randint(0, 2, (480, 640), dtype=np.uint8)
                roi_manager[i] = mask
            
            # 檢查檔案資訊
            info = roi_manager.get_file_info()
            print(f'File size: {info[\"file_size_mb\"]} MB')
            print(f'Masks count: {info[\"mask_count\"]}')
            print(f'Kinematic data count: {info[\"kinematic_data_count\"]}')
            
            roi_manager.close()
            os.unlink(tmp.name)
        
        print('Memory test completed successfully!')
        "

  validate-hdf5-structure:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install h5py numpy
        pip install -e .

    - name: Validate HDF5 file structure
      run: |
        python -c "
        import h5py
        import numpy as np
        from castle.utils.roi_manager import ROIManager
        import tempfile
        import os
        
        with tempfile.NamedTemporaryFile(suffix='.h5', delete=False) as tmp:
            # 建立測試檔案
            roi_manager = ROIManager(tmp.name,
                                   video_basename='validation_test.mp4',
                                   video_length=100,
                                   video_height=240,
                                   video_width=320,
                                   video_fps=25.0)
            
            # 添加一些測試資料
            mask = np.ones((240, 320), dtype=np.uint8) * 255
            roi_manager[0] = mask
            roi_manager[10] = mask
            
            roi_manager.close()
            
            # 驗證檔案結構
            with h5py.File(tmp.name, 'r') as f:
                # 檢查必要的群組
                assert 'meta' in f, 'Missing meta group'
                assert 'ROI' in f, 'Missing ROI group'
                assert 'kinematic' in f, 'Missing kinematic group'
                
                # 檢查 meta 資料
                meta = f['meta']
                assert 'video_basename' in meta, 'Missing video_basename in meta'
                assert 'video_fps' in meta, 'Missing video_fps in meta'
                assert meta['video_fps'][()] == 25.0, 'Incorrect video_fps value'
                
                # 檢查 ROI 資料
                roi = f['ROI']
                assert '0' in roi, 'Missing ROI/0'
                assert '10' in roi, 'Missing ROI/10'
                
                # 檢查 kinematic 資料
                kinematic = f['kinematic']
                required_datasets = ['x', 'y', 'area', 'speed', 'frame_indices']
                for dataset in required_datasets:
                    assert dataset in kinematic, f'Missing {dataset} in kinematic'
                
                print('HDF5 structure validation passed!')
            
            os.unlink(tmp.name)
        "
